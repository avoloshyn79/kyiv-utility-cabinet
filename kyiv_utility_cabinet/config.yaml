name: "Kyiv Utility Cabinet"
version: "2.2.0"
slug: "kyiv_utility_cabinet"
description: "Logs into Kyiv utility provider personal cabinets (YASNO, Kyivvodokanal, Kyivteploenergo, Kyivgaz) on a schedule and publishes the data to Home Assistant over MQTT"
url: "https://github.com/avoloshyn79/kyiv-utility-cabinet"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
services:
  - mqtt:want
ports:
  8099/tcp: 8099
ports_description:
  8099/tcp: "HTTP API - manual /fetch/<site> calls and /health"
options:
  api_key: ""
  discovery_prefix: "homeassistant"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  yasno:
    enabled: false
    phone: ""
    password: ""
    interval_minutes: 1440
schema:
  api_key: str
  discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  yasno:
    enabled: bool
    phone: str?
    password: password?
    interval_minutes: int(5,10080)
