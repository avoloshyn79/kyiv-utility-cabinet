name: "Kyiv Utility Cabinet"
version: "2.7.0"
slug: "kyiv_utility_cabinet"
description: "Logs into Kyiv utility provider personal cabinets (YASNO, Kyivvodokanal, Kyivteploenergo, Kyivgaz) on a schedule and publishes the data to Home Assistant over MQTT"
url: "https://github.com/avoloshyn79/kyiv-utility-cabinet"
arch:
  - amd64
  - aarch64
startup: application
boot: auto
init: false
homeassistant_api: true
services:
  - mqtt:want
ports:
  8099/tcp: 8099
  6080/tcp: 6080
ports_description:
  8099/tcp: "HTTP API - manual /fetch/<site> calls and /health"
  6080/tcp: "noVNC remote desktop - only active while kyivvodokanal.setup_mode is on"
webui: "http://[HOST]:[PORT:6080]/vnc.html?autoconnect=true&resize=remote"
options:
  debug: false
  api_key: ""
  discovery_prefix: "homeassistant"
  mqtt_host: ""
  mqtt_port: 1883
  mqtt_username: ""
  mqtt_password: ""
  yasno:
    enabled: false
    phone: ""
    password: ""
    interval_minutes: 1440
    submit_readings:
      enabled: false
      day_of_month: 25
      meter_type: "auto"
      entity_single: ""
      entity_day: ""
      entity_night: ""
  kyivvodokanal:
    enabled: false
    email: ""
    password: ""
    interval_minutes: 1440
    setup_mode: false
    submit_readings:
      enabled: false
      day_of_month: 26
      entity_hot: ""
      entity_cold: ""
schema:
  debug: bool
  api_key: str
  discovery_prefix: str
  mqtt_host: str?
  mqtt_port: port?
  mqtt_username: str?
  mqtt_password: password?
  yasno:
    enabled: bool
    phone: str?
    password: password?
    interval_minutes: int(5,10080)
    submit_readings:
      enabled: bool
      day_of_month: int(1,28)
      meter_type: list(auto|single|day_night)
      entity_single: str?
      entity_day: str?
      entity_night: str?
  kyivvodokanal:
    enabled: bool
    email: str?
    password: password?
    interval_minutes: int(5,10080)
    setup_mode: bool
    submit_readings:
      enabled: bool
      day_of_month: int(1,28)
      entity_hot: str?
      entity_cold: str?
